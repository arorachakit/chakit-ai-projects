<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1D1D1F"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="fg" x1="0" y1="0" x2="0" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff7b46"/>
      <stop offset="1" stop-color="#ff5e1f"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="32" height="32" rx="7.5" fill="url(#bg)"/>
  <rect x="0" y="0" width="32" height="32" rx="7.5" fill="none" stroke="rgba(255,255,255,0.06)"/>
  <!-- three stacked cards (roster) -->
  <rect x="6.5" y="8" width="19" height="4.5" rx="2.25" fill="url(#fg)"/>
  <rect x="6.5" y="14" width="19" height="4.5" rx="2.25" fill="rgba(255,94,31,0.55)"/>
  <rect x="6.5" y="20" width="19" height="4.5" rx="2.25" fill="rgba(255,94,31,0.30)"/>
  <!-- active dot -->
  <circle cx="22.5" cy="10.25" r="1.1" fill="#0b0807"/>
</svg>
